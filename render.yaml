# One-click deploy on Render: https://render.com/deploy
services:
  - type: web
    name: ghost-architect
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: ADMIN_LOGINS
        sync: false
      # Fine-grained PAT with public read access: GitHub API calls from the server (size checks,
      # PR evidence) get 5000/hour instead of sharing the host's anonymous 60/hour quota.
      - key: GITHUB_TOKEN
        sync: false
      # Optional: SMTP so notices and work handoffs also go out by email (Gmail app password works).
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Optional: free Upstash Redis keeps analyses and briefs across redeploys (the disk is ephemeral).
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
